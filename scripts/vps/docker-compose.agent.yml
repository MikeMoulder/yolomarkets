services:
  yolo-agent:
    image: ghcr.io/REPLACE_ME/yolo-agent:latest
    container_name: yolo-agent
    restart: unless-stopped
    env_file:
      - /etc/yolo-agent/agent.env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
